[package]
name = "llmctl"
version = "2.2.0"
edition = "2021"
description = "A CLI tool for testing and validating LLM (Large Language Model) services. Supports multiple providers including OpenAI, Gemini, Claude, Ollama, DeepSeek, and any OpenAI-compatible APIs. "
authors = ["zhangzhenhu"]
license = "MIT"
repository = "https://github.com/zhangzhenhu/llmctl"
homepage = "https://github.com/zhangzhenhu/llmctl"

[dependencies]
# CLI 参数解析
clap = { version = "4.5", features = ["derive"] }

# 异步运行时
tokio = { version = "1.36", features = ["full"] }
futures-util = "0.3"
futures = "0.3"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# 错误处理
thiserror = "1.0"

# 敏感信息
secrecy = "0.8"

# 彩色输出
colored = "2.1"

# 路径处理
dirs = "5.0"

# 日志
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.13.3", features = ["rustls","json", "stream","multipart", "gzip", "http2", "socks", "system-proxy"],default-features = false }
async-trait = "0.1"
genai = "0.7.0-beta.3"

[features]
default = []

# llmctl currently relies on a small vendored genai patch for
# stream-error diagnostics and OpenAI Responses provider-error parsing.
#
# crates.io publishing is disabled while this patch is required. Before
# removing this section or upgrading genai, see docs/vendored_genai_patch.md.
[patch.crates-io]
genai = { path = "vendor/genai" }
