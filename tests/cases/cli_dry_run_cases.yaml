cases:
  - name: "extra_body_runs_on_genai_with_vendor_patch"
    config_yaml: |
      version: 2
      active_profile: ali
      defaults:
        stream: true
      profiles:
        ali:
          adapter: aliyun
          model: glm-5
          base_url: https://dashscope.aliyuncs.com/compatible-mode/v1/
          api_key: test-key
          extra_body:
            enable_thinking: true
    args:
      - "-c"
      - "{config_path}"
      - "--reasoning"
      - "off"
      - "--dry-run"
    expect_exit_code: 0
    stdout_contains:
      - "runtime_backend: genai"
      - "reasoning_setting: off"
      - "reasoning_effort: none"
      - "capture_reasoning_content: false"
      - "extra_body_supported: true"
      - "extra_body_keys:"
      - "enable_thinking"
    stderr_contains: []

  - name: "endpoint_alias_chat_completions_is_accepted"
    config_yaml: |
      version: 2
      active_profile: openai_main
      profiles:
        openai_main:
          adapter: openai
          model: gpt-4o
          api_key: test-key
    args:
      - "-c"
      - "{config_path}"
      - "--api-mode"
      - "chat_completions"
      - "--dry-run"
    expect_exit_code: 0
    stdout_contains:
      - "api_mode_requested: ChatCompletions"
      - "api_mode_runtime: enforced_by_model_namespace"
      - "effective_model: openai::gpt-4o"
    stderr_contains: []

  - name: "aliyun_endpoint_responses_is_enforced_with_openai_resp_namespace"
    config_yaml: |
      version: 2
      active_profile: ali
      profiles:
        ali:
          adapter: aliyun
          model: qwen-plus
          base_url: https://dashscope.aliyuncs.com/compatible-mode/v1/
          api_key: test-key
    args:
      - "-c"
      - "{config_path}"
      - "--api-mode"
      - "responses"
      - "--dry-run"
    expect_exit_code: 0
    stdout_contains:
      - "adapter: aliyun"
      - "api_mode_requested: Responses"
      - "api_mode_runtime: enforced_by_model_namespace"
      - "effective_model: openai_resp::qwen-plus"
    stderr_contains: []

  - name: "no_stream_overrides_default_stream_true"
    config_yaml: |
      version: 2
      active_profile: openai_main
      defaults:
        stream: true
      profiles:
        openai_main:
          adapter: openai
          model: gpt-4o
          api_key: test-key
    args:
      - "-c"
      - "{config_path}"
      - "--no-stream"
      - "--dry-run"
    expect_exit_code: 0
    stdout_contains:
      - "stream: false"
    stderr_contains: []

  - name: "no_proxy_is_reflected_in_dry_run"
    config_yaml: |
      version: 2
      active_profile: openai_main
      profiles:
        openai_main:
          adapter: openai
          model: gpt-4o
          api_key: test-key
    args:
      - "-c"
      - "{config_path}"
      - "--no-proxy"
      - "--dry-run"
    expect_exit_code: 0
    stdout_contains:
      - "proxy_mode: disabled"
      - "runtime_backend: genai"
    stderr_contains: []

  - name: "profile_no_proxy_is_reflected_in_dry_run"
    config_yaml: |
      version: 2
      active_profile: openai_main
      defaults:
        no_proxy: false
      profiles:
        openai_main:
          adapter: openai
          model: gpt-4o
          api_key: test-key
          no_proxy: true
    args:
      - "-c"
      - "{config_path}"
      - "--dry-run"
    expect_exit_code: 0
    stdout_contains:
      - "proxy_mode: disabled"
      - "runtime_backend: genai"
    stderr_contains: []

  - name: "invalid_reasoning_value_returns_config_error"
    config_yaml: |
      version: 2
      active_profile: openai_main
      profiles:
        openai_main:
          adapter: openai
          model: gpt-4o
          api_key: test-key
    args:
      - "-c"
      - "{config_path}"
      - "--reasoning"
      - "weird-value"
      - "--dry-run"
    expect_exit_code: 1
    stdout_contains: []
    stderr_contains:
      - "invalid reasoning value"

  - name: "adapter_alias_aliyun_sets_expected_defaults"
    config_yaml: |
      version: 2
      active_profile: openai_main
      profiles:
        openai_main:
          adapter: openai
          model: gpt-4o
          base_url: https://api.openai.com/v1
          api_key_env: OPENAI_API_KEY
          api_key: test-key
    args:
      - "-c"
      - "{config_path}"
      - "--adapter"
      - "aliyun"
      - "--dry-run"
    expect_exit_code: 1
    stdout_contains:
      - "adapter: aliyun"
      - "model: qwen-max"
      - "base_url: https://dashscope.aliyuncs.com/compatible-mode/v1/"
    stderr_contains:
      - "missing_api_key"

  - name: "invalid_active_profile_fails_fast"
    config_yaml: |
      version: 2
      active_profile: missing_profile
      profiles:
        openai_main:
          adapter: openai
          model: gpt-4o
          api_key: test-key
    args:
      - "-c"
      - "{config_path}"
      - "--dry-run"
    expect_exit_code: 1
    stdout_contains: []
    stderr_contains:
      - "active_profile points to a missing profile"

  - name: "defaults_only_v2_config_keeps_defaults"
    config_yaml: |
      version: 2
      defaults:
        stream: false
        no_proxy: true
    args:
      - "-c"
      - "{config_path}"
      - "--dry-run"
    expect_exit_code: 1
    stdout_contains:
      - "stream: false"
      - "proxy_mode: disabled"
      - "api_mode_requested: Auto"
    stderr_contains:
      - "missing_api_key"

  - name: "reasoning_off_without_enable_thinking_stays_on_genai"
    config_yaml: |
      version: 2
      active_profile: ali
      profiles:
        ali:
          adapter: aliyun
          model: qwen-plus
          base_url: https://dashscope.aliyuncs.com/compatible-mode/v1/
          api_key: test-key
    args:
      - "-c"
      - "{config_path}"
      - "--reasoning"
      - "off"
      - "--dry-run"
    expect_exit_code: 0
    stdout_contains:
      - "runtime_backend: genai"
      - "reasoning_effort: none"
      - "capture_reasoning_content: false"
      - "extra_body_keys:"
      - "enable_thinking"
    stderr_contains: []
